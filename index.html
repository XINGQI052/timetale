<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f7f3">
  <meta name="description" content="本地优先的轻巧课程表：全周网格课表、提醒、导入导出，数据只留在自己的设备。">
  <title>课间 · 我的课表</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="课间">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#" aria-label="课间首页"><span class="brand-mark"><span></span><span></span><span></span><span></span></span><span>课间<span class="brand-dot">.</span></span></a>
      <div class="header-actions">
        <button class="pill-button" id="todayButton" type="button" title="回到本周">本周</button>
        <button class="pill-button" id="weekendToggle" type="button" aria-pressed="true" title="显示或隐藏周末">周末</button>
        <button class="pill-button" id="themeToggle" type="button" title="切换深浅色">🌙</button>
        <button class="pill-button" id="displayButton" type="button" title="显示设置">显示</button>
        <button class="pill-button" id="reminderQuick" type="button" title="提醒设置">提醒</button>
        <button class="avatar-button" id="profileButton" type="button" aria-label="查看本地数据说明">林</button>
      </div>
    </header>

    <main class="page-content">
      <div class="week-toolbar">
        <div class="week-nav">
          <button class="nav-button" id="prevWeek" type="button" aria-label="上一周">‹</button>
          <div class="week-label"><strong id="weekNum">第 1 周</strong><span id="weekRange">—</span></div>
          <button class="nav-button" id="nextWeek" type="button" aria-label="下一周">›</button>
        </div>
        <button class="text-button" id="exportQuick" type="button">导出分享 ↗</button>
      </div>

      <div class="week-slider-row"><span>第 1 周</span><input type="range" id="weekSlider" min="1" max="30" step="1" value="1" aria-label="快速跳转到教学周"><span>第 30 周</span></div>

      <div class="today-strip" id="todayStrip">今天没有安排课程。</div>

      <div class="week-scroll" id="weekScroll">
        <div class="week-inner" id="weekGrid"></div>
      </div>
      <p class="grid-hint">点击空白格子即可在对应时间添加课程；手机上左右滑动可切换周次。</p>

      <section class="quick-actions">
        <div class="panel-topline"><div><span class="section-label">MAKE IT YOURS</span><h2>让课表更懂你</h2></div></div>
        <div class="action-list">
          <button class="action-row" type="button" data-action="add"><span class="action-icon mint">＋</span><span class="action-text"><strong>添加一门课</strong><small>把新安排放进这一周</small></span><span class="action-arrow">↗</span></button>
          <button class="action-row" type="button" data-action="import"><span class="action-icon lilac">⇧</span><span class="action-text"><strong>从文件导入</strong><small>支持课表备份 JSON 或日历 ICS</small></span><span class="action-arrow">↗</span></button>
          <button class="action-row" type="button" data-action="share"><span class="action-icon peach">⌁</span><span class="action-text"><strong>导出并分享</strong><small>导出文件后发送给同学</small></span><span class="action-arrow">↗</span></button>
          <button class="action-row" type="button" data-action="install"><span class="action-icon sky">⤓</span><span class="action-text"><strong>安装到手机</strong><small>按你的浏览器给出安装步骤</small></span><span class="action-arrow">↗</span></button>
        </div>
      </section>

      <footer class="footer"><span>用一点从容，陪你走过这一周</span><span>MADE FOR YOUR OWN RHYTHM · 课间</span></footer>
    </main>
  </div>

  <div class="modal-backdrop" id="modalBackdrop" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-top"><div><span class="section-label" id="modalEyebrow">YOUR CLASS</span><h2 id="modalTitle">添加一门课</h2></div><button class="close-button" id="closeModal" type="button" aria-label="关闭">×</button></div><div id="modalBody"></div></section></div>
  <input type="file" id="importFile" accept=".json,.ics,.ical,.txt,application/json,text/calendar,text/plain" hidden>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js" defer></script>
</body>
</html>
