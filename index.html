<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f7f3">
  <meta name="description" content="本地优先的轻巧课程表：全周网格课表、提醒、导入导出，数据只留在自己的设备。">
  <title>课间 · 我的课表</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="课间">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="header-title">
        <strong id="headerMain">—</strong>
        <span id="headerSub">—</span>
      </div>
      <div class="header-actions" id="weekViewActions">
        <button class="pill-button" id="todayButton" type="button" title="回到本周">本周</button>
        <button class="pill-button" id="weekendToggle" type="button" aria-pressed="true" title="显示或隐藏周末">周末</button>
      </div>
    </header>

    <main class="page-content">
      <section class="tab-panel" id="tabSchedule" data-panel="schedule">
        <div class="week-toolbar">
          <div class="week-nav">
            <button class="nav-button" id="prevWeek" type="button" aria-label="上一周">‹</button>
            <button class="week-jump" id="weekJump" type="button" aria-label="选择周次">
              <strong id="weekNum">第 1 周</strong>
              <span id="weekRange">—</span>
            </button>
            <button class="nav-button" id="nextWeek" type="button" aria-label="下一周">›</button>
          </div>
        </div>

        <div class="today-strip" id="todayStrip">今天没有安排课程。</div>

        <div class="week-frame">
          <div class="week-scroll" id="weekScroll">
            <div class="week-inner" id="weekGrid"></div>
          </div>
          <div class="grid-empty-hint" id="gridEmptyHint" hidden>
            <div class="empty-illustration">✳</div>
            <p>课表还是空的，点任意格子就能加课</p>
            <div class="grid-empty-actions"><button type="button" id="emptyAdd">＋ 添加一门课</button><button type="button" id="emptyImport">从文件导入</button></div>
          </div>
        </div>
        <p class="grid-hint">点击空白格子即可在对应时间添加课程；手机上左右滑动可切换周次。长按课程可以复制、剪切或拖动换位置。</p>
      </section>

      <section class="tab-panel" id="tabImport" data-panel="import" hidden>
        <p class="panel-lead">把课程放进课表的所有方式都在这里，导入前会先预览，不会覆盖已有课程。</p>

        <div class="group">
          <span class="group-label">手动添加</span>
          <div class="card-list">
            <button class="card-row accent" type="button" data-action="add">
              <span class="card-icon solid">＋</span>
              <span class="card-text"><strong>添加一门课</strong><small>填写课名、老师、教室、星期与节次</small></span>
              <span class="card-chevron">›</span>
            </button>
          </div>
        </div>

        <div class="group">
          <span class="group-label">批量导入</span>
          <div class="card-list">
            <button class="card-row" type="button" data-action="import">
              <span class="card-icon lilac">⇧</span>
              <span class="card-text"><strong>从文件导入</strong><small>课表备份 JSON、日历 ICS 或文本</small></span>
              <span class="card-chevron">›</span>
            </button>
            <button class="card-row" type="button" data-action="ocr">
              <span class="card-icon gold">◫</span>
              <span class="card-text"><strong>图片识别导入</strong><small>传一张课表截图，自动读出课程</small></span>
              <span class="card-chevron">›</span>
            </button>
          </div>
        </div>

        <div class="tip-box"><strong>导入前请确认</strong><p>建议先「导出并分享」做一份备份，这样随时能回到现在这份课表。所有数据只存在这台设备上，不会上传。</p></div>
      </section>

      <section class="tab-panel" id="tabSettings" data-panel="settings" hidden>
        <div class="group">
          <div class="card-list">
            <div class="card-row static">
              <span class="card-text"><strong>深色模式</strong><small id="themeSettingHint">未手动选择时跟随系统</small></span>
              <button class="toggle" id="themeToggle" type="button" role="switch" aria-label="切换深色模式">🌙</button>
            </div>
          </div>
        </div>

        <div class="group">
          <span class="group-label">学期管理</span>
          <div class="card-list">
            <button class="card-row" type="button" id="semesterRow">
              <span class="card-icon lilac">◷</span>
              <span class="card-text"><strong id="semesterTitle">本学期</strong><small id="semesterSub">点这里设置学期起点</small></span>
              <span class="card-chevron">›</span>
            </button>
          </div>
        </div>

        <div class="group">
          <span class="group-label">课表显示</span>
          <div class="card-list">
            <div class="card-row static">
              <span class="card-text"><strong>显示周末</strong><small>在课表里保留周六、周日两列</small></span>
              <button class="toggle" id="settingShowWeekend" type="button" role="switch" aria-label="显示周末"></button>
            </div>
            <div class="card-row static">
              <span class="card-text"><strong>显示节次时间</strong><small>左侧时间轴显示每节的起止时间</small></span>
              <button class="toggle" id="settingShowSlotTime" type="button" role="switch" aria-label="显示节次时间"></button>
            </div>
            <button class="card-row" type="button" id="displayButton">
              <span class="card-text"><strong>课程块高度</strong><small id="heightSettingHint">拖动即时预览</small></span>
              <span class="card-chevron" id="heightValue">64 px</span>
            </button>
            <button class="card-row" type="button" id="slotTimeRow">
              <span class="card-text"><strong>课节时间</strong><small id="slotTimeSummary">—</small></span>
              <span class="card-chevron">›</span>
            </button>
          </div>
        </div>

        <div class="group">
          <span class="group-label">课程提醒</span>
          <div class="card-list">
            <button class="card-row" type="button" id="reminderQuick">
              <span class="card-text"><strong>上课提醒</strong><small id="reminderSettingHint">未开启</small></span>
              <span class="card-chevron">›</span>
            </button>
          </div>
        </div>

        <div class="group">
          <span class="group-label">应用</span>
          <div class="card-list">
            <button class="card-row" type="button" data-action="share">
              <span class="card-icon peach">⌁</span>
              <span class="card-text"><strong>导出并分享</strong><small>导出备份文件，或发给同学</small></span>
              <span class="card-chevron">›</span>
            </button>
            <button class="card-row" type="button" data-action="install">
              <span class="card-text"><strong>安装到手机</strong><small>按你的浏览器给出安装步骤</small></span>
              <span class="card-chevron">›</span>
            </button>
            <button class="card-row" type="button" id="profileButton">
              <span class="card-text"><strong>数据与隐私</strong><small>数据存在哪里、如何备份与共享</small></span>
              <span class="card-chevron">›</span>
            </button>
            <button class="card-row" type="button" id="checkUpdateRow">
              <span class="card-text"><strong>检查更新</strong><small id="updateHint">当前版本</small></span>
              <span class="card-chevron">›</span>
            </button>
          </div>
        </div>

        <p class="footer-note" id="footerVersion">课间</p>
      </section>

      <p class="page-footer">用一点从容，陪你走过这一周</p>
    </main>
  </div>

  <nav class="tabbar" id="tabBar" aria-label="主导航">
    <button class="tab-button on" type="button" data-tab="schedule" aria-current="page">
      <span class="tab-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16" rx="3.2"/><path d="M3 9.5h18M9 9.5v11"/></svg></span><span>课表</span>
    </button>
    <button class="tab-button" type="button" data-tab="import">
      <span class="tab-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5V3.5M12 3.5 7.5 8M12 3.5 16.5 8"/><path d="M4 14.5v3.2a2.8 2.8 0 0 0 2.8 2.8h10.4a2.8 2.8 0 0 0 2.8-2.8v-3.2"/></svg></span><span>导入课程</span>
    </button>
    <button class="tab-button" type="button" data-tab="settings">
      <span class="tab-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-2.87 1.2v.17a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 8.9 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 8.9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.51 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9v.09a1.7 1.7 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1z"/></svg></span><span>设置</span>
    </button>
  </nav>

  <div class="modal-backdrop" id="modalBackdrop" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-top"><div><span class="section-label" id="modalEyebrow">YOUR CLASS</span><h2 id="modalTitle">添加一门课</h2></div><button class="close-button" id="closeModal" type="button" aria-label="关闭">×</button></div><div id="modalBody"></div></section></div>
  <input type="file" id="importFile" accept=".json,.ics,.ical,.txt,application/json,text/calendar,text/plain" hidden>
  <input type="file" id="imageFile" accept="image/*" hidden>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="recognize.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
